<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App using JS Dom</title>
    <style>
        .card{
            width: 400px;
            height: 400px;
            background-color: aqua;
            align-items: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        margin: 0 auto;
        padding: 30px 0;
        box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        border-radius: 12px;
        }
        button{
            background-color: blue;
            color: aliceblue;
            }
        
    </style>
</head>
<body>
    <h1><center>BOOK STORE</center></h1>
    <div class="card">
        <img src="physics1.webp" width="200" height="200" alt="Book-image"/>
        <h3>Title:Physics</h3>
        <h4>₹351</h4>
        <button>Add to card</button>
    </div>
</body>
</html>
